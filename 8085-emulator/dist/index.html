<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8085 Emulator</title>
    <script type="module" crossorigin src="/8085-emulator/assets/index--vdiNHrn.js"></script>
    <link rel="stylesheet" crossorigin href="/8085-emulator/assets/index-DvGxX844.css">
  </head>
  <body>
    <div id="root">
      <div id="loading-screen">
        <div class="spinner"></div>
        <p>Loading 8085 Emulator...</p>
      </div>
    </div>
    <script src="wasm/wasm_exec.js"></script>
    <script>
      (async function() {
        try {
          const go = new Go();
          const result = await WebAssembly.instantiateStreaming(fetch("wasm/emulator.wasm"), go.importObject);
          go.run(result.instance);
        } catch (err) {
          console.error("Failed to load WASM:", err);
        }
      })();
    </script>
  </body>
</html>
